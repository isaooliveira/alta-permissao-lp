<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Efeito Alta Permissão</title>
    <script>
      (function () {
        var codes = {
          'wa-avisos': 'utm_source=whatsapp&utm_medium=grupo&utm_campaign=eap-set-2026&utm_content=grupo-avisos',
          'wa-alunas': 'utm_source=whatsapp&utm_medium=grupo&utm_campaign=eap-set-2026&utm_content=grupo-alunas',
          'wa-lista': 'utm_source=whatsapp&utm_medium=reativacao&utm_campaign=eap-set-2026&utm_content=lista-fria',
          'ig-stories': 'utm_source=instagram&utm_medium=organico&utm_campaign=eap-set-2026&utm_content=stories',
          'ig-feed': 'utm_source=instagram&utm_medium=organico&utm_campaign=eap-set-2026&utm_content=feed',
          bio: 'utm_source=instagram&utm_medium=organico&utm_campaign=eap-set-2026&utm_content=bio',
          'quiz-ig': 'utm_source=instagram&utm_medium=organico&utm_campaign=eap-set-2026&utm_content=quiz-ig',
          'quiz-67': 'utm_source=instagram&utm_medium=organico&utm_campaign=eap-set-2026&utm_content=quiz-67',
          'quiz-wa': 'utm_source=whatsapp&utm_medium=organico&utm_campaign=eap-set-2026&utm_content=quiz-wa'
        };
        var params = new URLSearchParams(location.search);
        var code = params.get('s') || location.hash.replace(/^#/, '');
        if (code === 'obg' || code === 'obrigado') return;
        if (code === 'evento-passado' || code === 'evento-ao-vivo') {
          try { history.replaceState(null, '', '/eap#' + code); } catch (e) {}
          return;
        }
        if (code === 'quiz-67' || params.get('utm_content') === 'quiz-67') {
          try { sessionStorage.setItem('eap_quiz_offer', '67'); } catch (e) {}
        }
        var utmQuery = (code && codes[code]) ? codes[code] : '';
        if (utmQuery && !params.get('utm_source')) {
          try { history.replaceState(null, '', '/eap?' + utmQuery); } catch (e) {}
        }
        window.__eapUtmQuery = utmQuery || (location.search.indexOf('utm_') !== -1 ? location.search.slice(1) : '');
      })();
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y98DTB03J4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Y98DTB03J4', {
        page_title: 'Efeito Alta Permissão',
        page_path: '/eap',
        page_location: location.origin + '/eap' + (window.__eapUtmQuery ? '?' + window.__eapUtmQuery : ''),
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
